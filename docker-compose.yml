version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: hk_student_hub_db
    environment:
      POSTGRES_DB: hk_student_hub_db
      POSTGRES_USER: hk_hub_user
      POSTGRES_PASSWORD: hk_hub_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hk_hub_user -d hk_student_hub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: hk_student_hub_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_hk_data &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 hk_hub_project.wsgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=huong-khe-production-super-secret-key-change-me-in-production-2026
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=hk_student_hub_db
      - DB_USER=hk_hub_user
      - DB_PASSWORD=hk_hub_secure_password
      - DB_HOST=db
      - DB_PORT=5432
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-false}
      - EMAIL_TIMEOUT=${EMAIL_TIMEOUT:-10}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      - GMAIL_SENDER_EMAIL=${GMAIL_SENDER_EMAIL:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - SCHOOL_UNION_NOTIFICATION_EMAIL=${SCHOOL_UNION_NOTIFICATION_EMAIL:-}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://127.0.0.1:8000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  email_worker:
    build: .
    container_name: hk_student_hub_email_worker
    command: python manage.py process_email_queue --loop
    volumes:
      - .:/app
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=huong-khe-production-super-secret-key-change-me-in-production-2026
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=hk_student_hub_db
      - DB_USER=hk_hub_user
      - DB_PASSWORD=hk_hub_secure_password
      - DB_HOST=db
      - DB_PORT=5432
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-false}
      - EMAIL_TIMEOUT=${EMAIL_TIMEOUT:-10}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      - GMAIL_SENDER_EMAIL=${GMAIL_SENDER_EMAIL:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - SCHOOL_UNION_NOTIFICATION_EMAIL=${SCHOOL_UNION_NOTIFICATION_EMAIL:-}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://127.0.0.1:8000}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
